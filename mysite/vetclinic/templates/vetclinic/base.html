{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}VetClinic{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar { margin-bottom: 2rem; }
    .hero { background: #f8f9fa; padding: 4rem 1rem; text-align: center; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .hero p { font-size: 1.25rem; margin-bottom: 1rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="{% url 'vetclinic:home' %}">VetClinic</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Филиалы</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'vetclinic:service_list' %}">Услуги</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Специалисты</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'vetclinic:pet_list' %}">Питомцы</a></li>
        <li class="nav-item"><a class="nav-link btn btn-primary text-white"
                                 href="#">Записаться</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="hero">
  <h1>Круглосуточная ветклиника</h1>
  <p>Профессиональный уход за вашим питомцем 24/7</p>
  <a href="#" class="btn btn-lg btn-success">Записаться на приём</a>
</div>

<div class="container">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
